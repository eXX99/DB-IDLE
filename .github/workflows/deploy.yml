name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate Dragon Ball Icons
        run: |
          pip install pillow
          python - << 'EOF'
          import math
          import os
          from PIL import Image, ImageDraw

          def draw_star(draw, center, size, fill_color):
              points = []
              for i in range(10):
                  r = size if i % 2 == 0 else size / 2.5
                  angle = i * math.pi / 5 - math.pi / 2
                  x = center[0] + r * math.cos(angle)
                  y = center[1] + r * math.sin(angle)
                  points.append((x, y))
              draw.polygon(points, fill=fill_color)

          def generate_db_icon(size, filepath):
              os.makedirs(os.path.dirname(filepath), exist_ok=True)
              img = Image.new("RGBA", (size, size), (15, 20, 28, 255))
              draw = ImageDraw.Draw(img)

              pad = size * 0.08
              outline_w = max(1, int(size * 0.025))
              draw.ellipse([pad, pad, size - pad, size - pad], fill=(255, 136, 0, 255), outline=(255, 210, 0, 255), width=outline_w)
              
              star_radius = size * 0.22
              draw_star(draw, (size / 2, size / 2), star_radius, (200, 25, 25, 255))
              
              img.save(filepath, "PNG")

          generate_db_icon(32, "web/favicon.png")
          generate_db_icon(192, "web/icons/Icon-192.png")
          generate_db_icon(512, "web/icons/Icon-512.png")
          print("Pomyślnie wygenerowano komplet ikon PWA!")
          EOF

      - name: Verify Flutter environment
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Configure GitHub Pages Base Path & Build Web
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          echo "Building for repository base-href: /$REPO_NAME/"
          flutter build web --release --base-href "/$REPO_NAME/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
